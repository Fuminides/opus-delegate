name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject CRLF line endings
        run: |
          if grep -rlI $'\r' --exclude-dir=.git .; then
            echo "Files above contain CRLF; the wrappers must stay LF." >&2
            exit 1
          fi

      - name: Validate plugin manifest and skill frontmatter
        run: |
          python3 -c "import json; json.load(open('.codex-plugin/plugin.json'))"
          python3 - <<'PY'
          import json, re, sys
          m = json.load(open('.codex-plugin/plugin.json'))
          assert re.fullmatch(r'\d+\.\d+\.\d+', m['version']), 'version must be strict semver'
          assert open('VERSION').read().strip() == m['version'], 'VERSION disagrees with plugin.json'
          fm = open('skills/opus-delegate/SKILL.md').read().split('---')[1]
          for field in ('name:', 'description:'):
              assert field in fm, f'SKILL.md frontmatter missing {field}'
          PY

      - name: Shell syntax check
        run: bash -n install.sh skills/opus-delegate/scripts/*.sh tests/test_scripts.sh

      - name: shellcheck
        run: |
          shellcheck -x -P SCRIPTDIR install.sh \
            skills/opus-delegate/scripts/opus_worker.sh \
            skills/opus-delegate/scripts/opus_consultant.sh \
            tests/test_scripts.sh

      - name: Run script tests
        run: bash tests/test_scripts.sh
